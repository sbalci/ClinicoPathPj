datasets:
  - name: Python Core Examples
    path: python_core_examples.omv
    description: Six Python core analyses using 36 synthetic observations.
    tags:
      - Python
      - Diagnostic accuracy
      - Decision curves
      - Data quality
  - name: Set Intersection Examples
    path: python_set_intersection_examples.csv
    description: >-
      Four synthetic binary markers with all sixteen membership patterns and two
      missing-value examples.
    tags:
      - Python
      - Set membership
      - Marker panels
  - name: 'Set Intersections: Unequal Frequencies'
    path: python_set_intersection_unequal_examples.csv
    description: >-
      Sixty synthetic complete marker panels with unequal pattern counts (0 to
      12) and two missing-value examples.
    tags:
      - Python
      - Set membership
      - Unequal frequencies
  - name: Univariate Screening Examples
    path: python_outlier_screening_examples.csv
    description: >-
      Thirty-one synthetic complete measurement pairs including one extreme
      pair, plus two rows with missing measurements.
    tags:
      - Python
      - Outliers
      - Data quality
  - name: Categorical Tree Examples
    path: python_variable_tree_examples.csv
    description: >-
      Thirty-six synthetic complete tumor/grade/stage profiles across three
      tumor categories, plus two missing-category examples.
    tags:
      - Python
      - Categorical tree
      - Descriptives
  - name: Tree Node Summary Examples
    path: python_tree_node_summary_examples.csv
    description: >-
      Eight synthetic profiles: seven categorical complete rows, four valid
      marker scores and node-local numeric missingness.
    tags:
      - Python
      - Categorical tree
      - Node summaries
  - name: Tree Reference Percentage Examples
    path: python_tree_reference_examples.csv
    description: >-
      Eight synthetic profiles with seven categorical complete rows, four valid
      reference classifications and both numeric/reference missingness.
    tags:
      - Python
      - Categorical tree
      - Reference percentages
  - name: Categorical Flow Examples
    path: python_alluvial_examples.csv
    description: >-
      Twenty complete synthetic profiles on four unequal paths (12, 5, 2, 1
      rows), plus two missing-category profiles.
    tags:
      - Python
      - Alluvial
      - Categorical flows
  - name: Grouped Cross Table Examples
    path: python_cross_table_examples.omv
    description: >-
      Twenty-five synthetic profiles with explicit continuous Age/Code types and
      a preconfigured cross table (Holm adjustment); default retention is 24,
      complete-case retention is 21.
    tags:
      - Python
      - Grouped summaries
      - Cross tables
  - name: Overall Table One Examples
    path: python_table_one_examples.omv
    description: >-
      Twenty-five synthetic profiles with explicit continuous Age/Code types,
      binary categories and an entirely uncollected variable; a preconfigured
      overall Table One retains 25 rows, or 21 with complete-case exclusion.
    tags:
      - Python
      - Overall cohort
      - Table One
  - name: Survival Outcome Coding Examples
    path: python_outcome_examples.csv
    description: >-
      Thirteen synthetic source records: six alive without disease, three alive
      with disease, two disease deaths, one other-cause death and one missing
      status. Competing-risk counts are 9, 2 and 1.
    tags:
      - Python
      - Outcome coding
      - Survival preparation
  - name: UTC Date Conversion Examples
    path: python_datetime_examples.csv
    description: >-
      Twelve synthetic profiles with separate calendar, Excel and Unix examples.
      Explicit YYYY-MM-DD parsing gives seven valid, four invalid and one
      missing value; the numeric columns illustrate different origins and
      fractions.
    tags:
      - Python
      - UTC dates
      - Data preparation
  - name: UTC Interval Examples
    path: python_interval_examples.csv
    description: >-
      Twelve synthetic date pairs with landmark ties, missing dates and an
      optional reversed interval.
    tags:
      - Python
      - Time intervals
      - Data preparation
  - name: Calendar Anniversary Examples
    path: python_calendar_interval_examples.csv
    description: >-
      Six synthetic month-end pairs comparing fixed-length durations with
      calendar rollback anniversaries, including one missing end date.
    tags:
      - Python
      - Calendar intervals
      - Data preparation
  - name: Numeric Date Encoding Examples
    path: python_numeric_date_examples.csv
    description: >-
      Six synthetic equivalent packed, Excel1900/1904 and Unix pairs; five
      complete intervals total 456 days. A separate malformed packed column
      illustrates invalid-date handling.
    tags:
      - Python
      - Numeric dates
      - Data preparation
  - name: Composite Outcome Status Examples
    path: python_composite_outcome_examples.csv
    description: >-
      Nine synthetic binary/unknown component pairs. OR status has five events,
      one zero and three unknowns; progression-only status has three events,
      three zeros and three unknowns. No event times are supplied.
    tags:
      - Python
      - Composite endpoints
      - Status preparation
  - name: Interval Censoring Input Examples
    path: python_interval_censoring_examples.omv
    description: >-
      Ten synthetic endpoint pairs with continuous numeric types: eight
      informative records (three exact, two left-censored, one right-censored
      and two interval-censored), one reversed pair and one uninformative pair.
      Signed times are illustrative.
    tags:
      - Python
      - Interval censoring
      - Data preparation
  - name: Two-Component First-Event Examples
    path: python_first_event_examples.omv
    description: >-
      Twelve synthetic component timelines with nine usable records (six events
      and three censored), missingness, a negative duration, exact event/censor
      ties and known events beyond common follow-up. Literal expected outputs
      are provided.
    tags:
      - Python
      - Composite endpoints
      - Data preparation
  - name: First-Event Subject Identity Examples
    path: python_first_event_identity.omv
    description: >-
      Twelve synthetic component timelines: eleven known ID records, nine
      distinct known IDs, two repeated IDs across four records and one missing
      ID. Labels 001, 01 and 1 remain distinct. Endpoints retain nine usable
      record-level results.
    tags:
      - Python
      - Subject identity
      - Composite endpoints
  - name: Diagnostic Study Review Examples
    path: python_diagnostic_study_examples.omv
    description: >-
      Twelve synthetic study rows: eight retained 2x2 tables, four invalid-count
      exclusions, three retained zero-cell tables, one unknown ID and one
      repeated cohort label. Study-level Wilson intervals only; no pooled model.
    tags:
      - Python
      - Diagnostic studies
      - Evidence review
  - name: Independent Measurement Pair Examples
    path: python_agreement_examples.omv
    description: >-
      Twelve synthetic paired measurement rows with eight complete independent
      cases and four pairwise missing exclusions; conventional raw-scale
      Bland-Altman review only.
    tags:
      - Python
      - Agreement
      - Bland-Altman
  - name: Balanced ICC Examples
    path: python_icc_examples.omv
    description: >-
      Eight synthetic cases and three raters; six complete independent cases and
      two excluded rows. Balanced ICC examples without clinical interpretation
      bands.
    tags:
      - Python
      - Agreement
      - ICC
  - name: Python Execution Service Examples
    path: python_service_examples.omv
    description: >-
      Six synthetic measurements, including one missing cell; matched own-Python
      and Pj service summary examples.
    tags:
      - Python
      - Pj
      - Execution services
  - name: Age Pyramid Service Examples
    path: python_age_pyramid_service_examples.omv
    description: >-
      22 synthetic rows with 18 retained observations, unequal age-band counts,
      missing pairs, a negative age and an unselected gender level; compare Age
      Pyramid with Age Pyramid via Pj.
    tags:
      - Python
      - Pj
      - Age pyramid
  - name: Paired Binary Test Examples
    path: python_paired_test_examples.csv
    description: >-
      Twenty synthetic cases with three paired binary calls: the third test
      includes one explicit indeterminate result. All three tests retain 16
      common cases after explicit exclusion; three rows have missing roles and
      one has an outside-pair result.
    tags:
      - Python
      - Paired diagnostic tests
      - Common cohort
  - name: Independent and Paired Mean Examples
    path: python_estimation_examples.csv
    description: >-
      Thirteen synthetic independent cases in groups of five and eight; the two
      wide measurement columns retain five complete paired subjects and exclude
      eight rows. Leading-zero subject labels remain distinct. Raw mean
      estimation examples only.
    tags:
      - Python
      - Mean differences
      - Paired measurements
  - name: Histogram and One-Sample Mean Examples
    path: python_histogram_examples.csv
    description: >-
      Twenty retained synthetic measurements and two missing rows, with
      skewness, ties and unequal bin counts. A manual width of two gives counts
      5, 7, 4, 1, 1, 1, 0, 0, 0, 1; optional Student results are illustrative.
    tags:
      - Python
      - Histogram
      - One-sample mean
  - name: Categorical Bar Frequency Examples
    path: python_barstats_examples.csv
    description: >-
      Seven synthetic frequency rows: four positive complete cells represent 50
      observations in groups of 20 and 30; one complete row has zero frequency
      and two rows have missing roles. Compare equal-height percentage bars with
      unequal-height count bars.
    tags:
      - Python
      - Categorical bars
      - Frequency denominators
  - name: Pie Frequency Examples
    path: python_pie_examples.csv
    description: >-
      Six synthetic source rows: three positive categories represent 25
      observations, one declared category has zero frequency, and two rows have
      missing selected roles. Pie and table retain the zero category without
      expanding observations.
    tags:
      - Python
      - Pie charts
      - Declared categories
  - name: Lollipop Aggregation Examples
    path: python_lollipop_examples.csv
    description: >-
      Eight synthetic rows illustrate unequal category sizes and two missing
      pairs. Six complete observations have a raw mean of 30.67; the three
      plotted group means average 37.33. Compare raw and plotted denominators,
      sorting and the reference line.
    tags:
      - Python
      - Lollipop charts
      - Group aggregation
  - name: Waffle Panel Denominator Examples
    path: python_waffle_examples.csv
    description: >-
      Nine synthetic frequency rows: active panels represent 4 and 1,000
      observations, a zero-frequency panel is inactive, and two rows have
      missing roles. A rare positive category receives no tile; exact counts
      remain available.
    tags:
      - Python
      - Waffle charts
      - Panel denominators
  - name: Single-Cohort Survival Examples
    path: python_singlearm_examples.csv
    description: >-
      Eleven synthetic subjects: elapsed months, explicit Event/Censored labels,
      tied times, a time-zero event and two incomplete pairs. Select Event as
      event and Censored as censoring; requested times are 12, 36 and 60 months.
    tags:
      - Python
      - Survival
      - Explicit event orientation
  - name: 'Saved Analysis: Age Pyramid Comparison'
    path: python_age_pyramid_comparison_examples.omv
    description: >-
      Configured synthetic Age Pyramid Comparison workbook saved with
      ClinicoPathPj 0.3.62. Contains pyagepyramid,pyagepyramidpj. Use that
      version or a later compatible module to recalculate; Pj service
      comparisons also require Pj.
    tags:
      - Python
      - Saved analyses
      - Age Pyramid Comparison
